<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Pokémon Bank</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container-fluid">
  <div class="row min-vh-100">
    <section class="col-md-6 login-izq d-flex flex-column justify-content-center p-5">
     <img src="images/logo.png" alt="Logo Pokémon Bank" class="img-fluid mb-3" style="max-width: 280px;">
      <h1 class="font-weight-bold mt-3">Tu cajero automático Pokémon</h1>
      <p class="lead">Deposita, retira, consulta tu saldo y paga tus servicios de forma rápida y segura.</p>
    </section>
    <section class="col-md-6 d-flex align-items-center justify-content-center p-4">
     <form class="card card-pk p-4 w-100" style="max-width:400px" action="menu.html">
  <h2 class="font-weight-bold">Iniciar sesión</h2>
  <p class="text-muted" id="pl">Ingresa tu PIN de 4 dígitos</p>

  <div class="pin-wrap">
    <div class="d-flex justify-content-center mb-3" role="group" aria-labelledby="pl">
      <input class="pin mx-1" type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 1 del PIN">
      <input class="pin mx-1" type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 2 del PIN">
      <input class="pin mx-1" type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 3 del PIN">
      <input class="pin mx-1" type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 4 del PIN">
    </div>
<div class="text-center mb-3">
  <button type="button" class="btn btn-sm btn-outline-secondary" id="btnVer">Mostrar dígitos</button>
</div>
    <div class="keypad">
      <button type="button" class="key" data-num="1">1</button>
      <button type="button" class="key" data-num="2">2</button>
      <button type="button" class="key" data-num="3">3</button>
      <button type="button" class="key" data-num="4">4</button>
      <button type="button" class="key" data-num="5">5</button>
      <button type="button" class="key" data-num="6">6</button>
      <button type="button" class="key" data-num="7">7</button>
      <button type="button" class="key" data-num="8">8</button>
      <button type="button" class="key" data-num="9">9</button>
      <button type="button" class="key key-borrar" id="btnBorrar">Borrar</button>
      <button type="button" class="key" data-num="0">0</button>
      <button type="button" class="key key-limpiar" id="btnLimpiar">Limpiar</button>
    </div>
  </div>
  
<button type="submit" class="btn btn-pk btn-block mt-3" id="btnIngresar" disabled>Ingresar</button>
</form>
    </section>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const pins = Array.from(document.querySelectorAll('.pin'));
  const btnVer = document.getElementById('btnVer');
  const btnIngresar = document.getElementById('btnIngresar');
  const form = document.querySelector('form');

  // Habilita "Ingresar" solo si las 4 casillas tienen un dígito
  function validar() {
    const completo = pins.every(p => p.value !== '');
    btnIngresar.disabled = !completo;
  }

  // Teclas numéricas
  document.querySelectorAll('.key[data-num]').forEach(btn => {
    btn.addEventListener('click', () => {
      const vacio = pins.find(p => p.value === '');
      if (vacio) vacio.value = btn.dataset.num;
      validar();
    });
  });

  // Borrar: quita el último dígito escrito
  document.getElementById('btnBorrar').addEventListener('click', () => {
    const llenos = pins.filter(p => p.value !== '');
    if (llenos.length) llenos[llenos.length - 1].value = '';
    validar();
  });

  // Limpiar: vacía todas las casillas
  document.getElementById('btnLimpiar').addEventListener('click', () => {
    pins.forEach(p => p.value = '');
    validar();
  });

  // Mostrar / Ocultar dígitos (independiente de los otros botones)
  btnVer.addEventListener('click', () => {
    const oculto = pins[0].type === 'password';
    pins.forEach(p => p.type = oculto ? 'text' : 'password');
    btnVer.textContent = oculto ? 'Ocultar dígitos' : 'Mostrar dígitos';
  });

  // Seguridad extra: si el PIN está incompleto, no deja enviar
  form.addEventListener('submit', (e) => {
    if (!pins.every(p => p.value !== '')) {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
