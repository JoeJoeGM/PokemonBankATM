<!DOCTYPE html>
<html lang="es">
    <meta charset="UTF-8">
    <head>
        <title>Ejemplos de librerias</title>
        <link rel="stylesheet" href="ejemplolibrerias/css/styles.css">

        <!--Librerias-->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>

    </head>

    <body>
        <div class="contenedor-principal">
            <h1>Esta es una demostracion de las librerias</h1>
            <section class="tarjeta">
                <h2>SweetAlert</h2>
                <button onclick="ejecutarSwetAlert1()" class="boton boton-azul">
                    Ejemplo 1
                </button>
                <button onclick="ejecutarSwetAlert2()" class="boton boton-esmeralda">
                    Ejemplo 2
                </button>
            
            </section>

            <section class="tarjeta">
            <h2>jsPDF</h2>
                <button onclick="generarPDF()" class="boton boton-rojo">
                    Ejemplo 1
                </button>
                <button onclick="generarPDFTabla()" class="boton boton-ambar">
                    Ejemplo 2
                </button>
        </section>

        <section class="tarjeta">
            <h2>Ejemplos de Chart</h2>
            <div class="contenedor-graficas">
                <canvas id="graficaBarras" width="100" height="50"></canvas>
                <canvas id="graficaLineas" width="100" height="50"></canvas>
            </div>
        </section>
        <section class="tarjeta">
            <h2>Ejemplo 1 de ValidateJS</h2>
            <h3>Valida que el username tenga entre 3 y 15 caracteres y que el email tenga formato de correo</h3>
            <form id="miForm">
                <input type="text" name="username" placeholder="Usuario" required>
                <input type="text" name="email" placeholder="email" required>
                <button type="submit">Enviar</button>
            </form>        

        </section>

        <section class="tarjeta">
            <h2>Ejemplo 2 de ValidateJS</h2>
            <h3>Valida que el PIN sea de 4 digitos</h3>
            <form id="formPin">                
                    <input type="password" name="pin" maxlength="4" placeholder="Ingresa PIN de 4 digitos">
                    <p id="error-pin" class="texto-error"></p>                
                <button type="submit">Validar PIN</button>
            </form>
            
        </section>
        </div>

        
        


        <script src="ejemplolibrerias/js/swetalert.js"></script>
        <script src="ejemplolibrerias/js/jsPDF.js"></script>
        <script src="ejemplolibrerias/js/Chart.js"></script>
        <script src="ejemplolibrerias/js/validateJS.js"></script>
        
    </body>




</html>
